# Meson cross file for building and running Grex as if on an Intel Sapphire Rapids CPU, executing
# the resulting binaries under Intel SDE instead of requiring actual Sapphire Rapids hardware. Grex’s
# own build already builds and tests one binary per detected x86-64-vN microarchitecture level plus
# one per detected optional extension (e.g. AVX512-FP16, see tools/cpuid.cpp); running that
# detection through SDE (rather than real CPUID) is what makes it pick up Sapphire Rapids’ full
# feature set, in particular AVX512-FP16, which is not implied by any microarchitecture level and
# is therefore otherwise never exercised.
#
# Usage (from the repository root):
#   # Assuming sde64 is on PATH; set GREX_SDE_PATH to override
#   meson setup build-spr --cross-file cross/sapphirerapids-sde.ini -Dbuild_tests=true
#   meson test -C build-spr

[binaries]
c = 'gcc'
cpp = 'g++'
strip = 'strip'
# The wrapper script is in the same folder, which is given in `@DIRNAME@`.
exe_wrapper = '@DIRNAME@' / 'sde-wrapper.sh'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'sapphirerapids'
endian = 'little'

[properties]
# Host and build machine agree on system/cpu_family/endian (both are plain little-endian Linux
# x86-64), which is exactly the condition under which Meson otherwise assumes it can run host
# binaries directly and skips exe_wrapper: without this override, compiled binaries would run
# directly on the build host’s real CPU instead of through SDE, silently defeating the whole point
# of this cross file (e.g. AVX512-FP16 support would go undetected unless the build host happens
# to have it too).
needs_exe_wrapper = true
